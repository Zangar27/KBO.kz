<title>kbo.kz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FFFDF8;--card:#fff;--ink:#26304A;--head:#1F2F5C;--mute:#6A7390;--line:#ECE4D3;--or:#FF6B1A;--gold:#FFC93C;--sel:#FFF0C2;--av:#FFE98A;--late:#E5252A;--ok:#1E9E5A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "PT Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg) linear-gradient(#FFF1C7,#FFFDF8 380px) no-repeat;min-height:100vh}
h1,h2{font-family:"PT Serif",Georgia,serif;color:var(--head);margin:0}
h1{font-size:30px;margin:18px 0 6px}h1 small{font:700 16px "PT Sans",sans-serif;color:var(--mute);margin-left:10px}
h2{font-size:20px;margin:24px 0 10px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}.wrap.wide{max-width:1380px}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-top:10px}
.l,.r{display:flex;align-items:center;gap:12px}.r{justify-content:flex-end}
.hero{height:170px;width:auto;display:block}
.ib{border:0;background:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--head)}
.logo{font:700 30px/1 Oswald,sans-serif;color:var(--or);letter-spacing:1px}
.who{display:flex;align-items:center;gap:10px;font-size:15px}
.av{width:38px;height:38px;border-radius:50%;background:var(--av);display:grid;place-items:center;font-weight:700;color:var(--head)}
.btn{border:0;background:var(--or);color:#fff;padding:9px 18px;border-radius:8px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:3px 10px;font-size:14px}.btn.full{width:100%;margin-top:16px}
.mute{color:var(--mute);font-size:14px}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.card.ov{border-color:var(--late);background:#FFF5F5}
.card.done .t{text-decoration:line-through;color:var(--mute)}
.chk{flex:none;width:24px;height:24px;margin-top:1px;border:2px solid #B8BFD3;border-radius:6px;background:#fff;color:var(--or);font-weight:700;line-height:1;padding:0}
.card.done .chk{border-color:var(--or)}
.b{flex:1;min-width:0;cursor:pointer}.t{font-weight:700;word-break:break-word}
.meta{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);margin-top:3px;min-width:0}
.meta>span{display:flex;align-items:flex-start;gap:6px;min-width:0;overflow-wrap:anywhere}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.tm svg{flex:none;margin-top:2px}.tm.ov{color:var(--late);font-weight:700}
.dead{display:block;margin-top:6px;background:var(--late);color:#fff;font-weight:700;font-size:12px;letter-spacing:.5px;padding:3px 8px;border-radius:6px;text-align:center}
.bd{align-self:flex-start}.col>*{min-width:0}
.bd{font-weight:700;padding:0 8px;border-radius:10px;color:#fff;background:var(--late)}.bd.done{background:var(--ok)}.bd.doing{background:#E69A00}
.mv{display:flex;gap:6px;margin-top:8px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--mute);text-align:center;background:#fff}
.stat{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 10px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sum b{display:block;font:700 26px "PT Serif",serif;color:var(--head)}.sum span{font-size:13px;color:var(--mute)}
.pb{height:8px;border-radius:6px;background:#F1EADB;overflow:hidden}.pb b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--or));border-radius:6px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px;align-items:start}
.col{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:10px;min-height:200px}
.col.we{background:#FFFAEB}.col.today{border-color:var(--or);border-width:2px;border-top-width:5px}.col.dz{background:var(--sel)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dn{font:700 16px "PT Serif",serif;color:var(--head)}.cnt{font-weight:700;color:var(--or);font-size:14px}
.col .pb{margin-bottom:10px}.col .card{padding:8px;font-size:14px;gap:8px}
.addb{width:100%;border:1px dashed #D8CFB8;background:none;border-radius:8px;padding:6px;color:var(--mute);font-size:14px}
.addb:hover{border-color:var(--or);color:var(--or)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 16px;font-weight:700;color:var(--mute)}.seg button[aria-current=true]{background:var(--or);color:#fff}
input,select,textarea{background:#fff;border:1px solid #D9D2C0;border-radius:8px;padding:9px 10px;width:100%}
.bar2 select{width:auto}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
dialog{border:0;border-radius:14px;padding:22px;background:#fff;color:var(--ink);width:min(440px,94vw);box-shadow:0 10px 40px rgba(31,47,92,.25)}
dialog::backdrop{background:rgba(31,47,92,.4)}
.srow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.srow input[type=color]{width:46px;height:40px;padding:2px;flex:none}
#ov{position:fixed;inset:0;background:rgba(31,47,92,.4);z-index:19;display:none}#ov.on{display:block}
#dr{position:fixed;top:0;left:0;bottom:0;width:270px;background:#fff;box-shadow:4px 0 24px rgba(31,47,92,.15);z-index:20;transform:translateX(-100%);transition:transform .18s;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px}
#dr.on{transform:none}#dr .logo{padding:4px 10px 14px}.sp{flex:1}
.nv{border:0;background:none;text-align:left;padding:11px 12px;border-radius:8px;font-weight:700;color:var(--ink)}
.nv[aria-current=true]{background:var(--sel);color:var(--or)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.ac{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 8px 30px rgba(31,47,92,.1)}
.ac .logo{text-align:center;font-size:40px}.ac p{text-align:center;margin:2px 0 14px}.ac .hero{height:130px;margin:0 auto}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-current=true]{color:var(--or);border-color:var(--or)}
.err{color:var(--late);font-size:14px;min-height:20px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.r{flex-direction:column;align-items:flex-end;gap:6px}.rr{display:flex;align-items:center;gap:12px}
.clk{display:flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 12px;font-size:12px;color:var(--mute)}
.clk b{font:700 20px "PT Sans",monospace;font-variant-numeric:tabular-nums;color:var(--head)}.clk.hot b{color:var(--late)}
.big2{font:700 56px/1.1 "PT Serif",serif;color:var(--head);font-variant-numeric:tabular-nums}
.pn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-weight:700}
.opt:hover{border-color:var(--or)}.opt:disabled{color:inherit;opacity:1;cursor:default}.opt.ok{background:#E8F7EE;border-color:var(--ok)}.opt.no{background:#FFF0F0;border-color:var(--late)}
.g2{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}.hbar .pb{flex:1}.hbar span{min-width:140px;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:8px}.bars>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;background:linear-gradient(var(--gold),var(--or));border-radius:4px 4px 0 0;min-height:2px}.bars b{font-size:11px;color:var(--head)}
.fl{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14px}.fl span{flex:1;min-width:0;overflow-wrap:anywhere}
.ntx{white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:860px){.board{grid-template-columns:1fr}.sum{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.bar .wrap{grid-template-columns:1fr auto}.hero{height:120px}.bar .c{grid-column:1/-1;grid-row:2;justify-self:center}.who span{display:none}}
@media (max-width:560px){.week{grid-template-columns:1fr}.col{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <h2 id="dt" style="margin-top:0">Жаңа тапсырма</h2>
  <label for="f-title">Тапсырма атауы</label><input id="f-title" maxlength="120">
  <label for="f-sub">Пән</label><select id="f-sub"></select>
  <div class="row"><div><label for="f-date">Күні</label><input id="f-date" type="date"></div>
  <div><label for="f-h">Дедлайн уақыты</label><div class="row" style="gap:6px"><select id="f-h" aria-label="Сағат"></select><select id="f-m" aria-label="Минут"></select></div></div></div>
  <label for="f-prio">Маңыздылығы</label>
  <select id="f-prio"><option value="1">Қарапайым (10 XP)</option><option value="2" selected>Орташа (20 XP)</option><option value="3">Маңызды (30 XP)</option></select>
  <label for="f-note">Жазба</label><textarea id="f-note" rows="3"></textarea>
  <label for="f-up">Файлдар (сурет, PDF, 5 МБ дейін)</label><div id="f-files"></div><input id="f-up" type="file" accept="image/*,.pdf,.txt" multiple><div class="mute" id="f-msg" role="status"></div>
  <div class="acts"><button class="btn" data-a="save">Сақтау</button><button class="btn ghost" data-a="close">Болдырмау</button>

</dialog>
<dialog id="dm" aria-labelledby="dmt"><h2 id="dmt" style="margin-top:0">Қате қосу</h2>
  <label for="m-sub">Пән</label><select id="m-sub"></select>
  <label for="m-top">Тақырып</label><input id="m-top" maxlength="100">
  <label for="m-q">Қате / сұрақ</label><textarea id="m-q" rows="3"></textarea>
  <label for="m-a">Дұрыс жауап / түсіндірме</label><textarea id="m-a" rows="3"></textarea>
  <div class="acts"><button class="btn" data-a="msave">Сақтау</button><button class="btn ghost" data-a="mclose">Болдырмау</button><button class="btn ghost" id="mdel" data-a="mdel" style="margin-left:auto;color:var(--late)">Жою</button></div></dialog>
<dialog id="dq" aria-labelledby="dqt" style="width:min(560px,94vw)"><h2 id="dqt" style="margin-top:0">Квиз құру</h2>

  <label for="q-x">Сұрақтар</label><textarea id="q-x" rows="9"></textarea>

 await sb('/rest/v1/kbo_data?on_conflict=user_id',{method:'POST',token:t,prefer:'resolution=merge-duplicates,return=minimal',body:{user_id:SES.id,data:S,updated_at:new Date().toISOString()}});cs('Серверге сақталды ✓')}catch(e){cs('Серверге сақталмады')}},800)}
async function syncIn(){
 try{const t=await tok(),r=await sb('/rest/v1/kbo_data?select=data&limit=1',{token:t}),d=r&&r[0]&&r[0].data;
  if(d&&Array.isArray(d.tasks)&&(d.upd||0)>(S.upd||0)){S=d;sv('kbo.d.'+user,S)}else push();cs('Серверге қосылды ✓')}
 catch(e){if(!(e instanceof TypeError)&&/jwt|token|session|refresh|expired|no session/i.test(e.message)){SES=null;sv(SBK,null);showAuth()}else cs('Серверге қосыла алмады')}}
const netErr=x=>x instanceof TypeError?'Интернет қосылымын тексер':x.message;
async function register(){
 const u=$('#r-u').value.trim().toLowerCase(),n=$('#r-n').value.trim(),p=$('#r-p').value,p2=$('#r-p2').value,c=$('#r-c').value.trim();let e='';
 if(!/^[a-z0-9_]{3,20}$/.test(u))e='Пайдаланушы аты: 3–20 таңба, тек латын әріптері, сандар және _';
 else if(!n)e='Атыңды жаз';else if(p.length<8)e='Пароль кемінде 8 таңбадан тұруы керек';else if(p!==p2)e='Парольдер сәйкес емес';
 if(e)return err(e);
 try{const j=await sb('/auth/v1/signup',{method:'POST',body:{email:em(u),password:p,data:{name:n,code:c}}});
  if(!j||!j.access_token)return err('Тіркелді, бірақ Supabase-те «Confirm email» өшірілмеген');setSes(j);start()}
 catch(x){err(/registered|exists/i.test(x.message)?'Бұл пайдаланушы аты бос емес':/password/i.test(x.message)?'Пароль әлсіз: кемінде 8 таңба, кіші және бас әріп, сан керек':/database error|invite|code/i.test(x.message)?'Шақыру коды дұрыс емес немесе біткен':netErr(x))}
}

const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date()),dt=s=>new Date(s+'T12:00'),nowT=()=>new Date().toTimeString().slice(0,5);
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const mon=s=>addD(s,-((dt(s).getDay()+6)%7));
const fmt=s=>dt(s).getDate()+' '+MON[dt(s).getMonth()],dmy=s=>s.split('-').reverse().join('.');
const xpOf=t=>t.prio*10,sub=id=>S.subs.find(s=>s.id==id)||{name:'Пәнсіз',color:'#8A93AB'};
const over=t=>t.status!='done'&&(t.date<today()||(t.date==today()&&t.time&&t.time<nowT()));
const tsort=(a,b)=>ST.indexOf(a.status)-ST.indexOf(b.status)||(a.time||'99').localeCompare(b.time||'99')||b.prio-a.prio;
function stats(){
 const done=S.tasks.filter(t=>t.status=='done'),xp=done.reduce((a,t)=>a+xpOf(t),0),days=new Set(done.map(t=>t.doneAt));
 let c=0,d=today();if(!days.has(d))d=addD(d,-1);while(days.has(d)){c++;d=addD(d,-1)}
 return{xp,lvl:Math.floor(xp/100)+1,streak:c};
}

 x.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).forEach(b=>{let q=[],o=[],a=-1;

 if(tm.phase=='w'){S.sessions.push({date:today(),subj:tm.subj,min:tm.w});save();toast('Сессия аяқталды: +'+tm.w+' мин');tm.phase='b'}else{toast('Демалыс аяқталды');tm.phase='w'}

function sec(){
 const n=new Date(),e=new Date(n);e.setHours(23,59,59,0);const r=Math.max(0,Math.floor((e-n)/1000)),c=$('#clk');
 if(c){c.textContent=[Math.floor(r/3600),Math.floor(r%3600/60),r%60].map(v=>String(v).padStart(2,'0')).join(':');c.parentNode.classList.toggle('hot',r<3600)}
 if(tm.run){tm.left=Math.max(0,Math.ceil((tm.end-Date.now())/1000));const t=$('#tmv');if(t)t.textContent=mmss(tm.left);if(!tm.left)tmDone()}
 if(qz&&qz.end&&!qz.done){qz.left=Math.max(0,Math.ceil((qz.end-Date.now())/1000));const t=$('#qtm');if(t)t.textContent=mmss(qz.left);if(!qz.left)qFinish()}}
setInterval(sec,1000);

function vTimer(){

 return `<h1>Оқу таймері</h1><div class="pn" style="text-align:center"><div class="mute">${tm.phase=='w'?'Оқу уақыты':'Демалыс'}</div><div class="big2" id="tmv">${mmss(tm.left)}</div>

 <div class="sum"><div><b>${sum(s=>s.date==t0)}</b><span>Бүгін, мин</span></div><div><b>${sum(s=>s.date>=w0)}</b><span>Осы апта, мин</span></div><div><b>${ss.filter(s=>s.date==t0).length}</b><span>Бүгінгі сессия</span></div><div><b>${ss.length}</b><span>Барлық сессия</span></div></div>

async function upFiles(fs){const m=$('#f-msg');
 for(const f of fs){if(f.size>5242880){m.textContent=f.name+': 5 МБ-тан үлкен';continue}
  try{m.textContent='Жүктелуде: '+f.name;const t=await tok(),path=SES.id+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+'-'+f.name.replace(/[^\w.\-]+/g,'_');
   const r=await fetch(SB_URL+'/storage/v1/object/'+BKT+'/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':f.type||'application/octet-stream'},body:f});

  catch(e){m.textContent='Жүктелмеді: '+f.name+' (файл түрі немесе Storage баптауы)'}}

});
document.addEventListener('change',e=>{const g=e.target,i=g.id;
 if(i=='fs'){fs=g.value;render()}else if(i=='mf'){mf=g.value;render()}else if(i=='ms'){mst=g.value;render()}
 else if(i=='tm-s')tm.subj=g.value;
 else if(i=='tm-w'||i=='tm-b'){tm[i=='tm-w'?'w':'b']=Math.max(1,Math.min(180,+g.value||25));if(!tm.run&&((i=='tm-w')==(tm.phase=='w')))tm.left=tm[tm.phase]*60;render()}
 else if(i=='ex-d'){S.exam.date=g.value;save();render()}
 else if(i=='f-up'){upFiles([...g.files]);g.value=''}
 else if(g.classList&&g.classList.contains('ex')){const r=S.exam.rows[+g.dataset.i],k=g.dataset.k;r[k]=k=='n'?g.value:Math.max(0,+g.value||0);save();render()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c){e.preventDefault();document.querySelectorAll('.dz').forEach(x=>x!==c&&x.classList.remove('dz'));c.classList.add('dz')}});
document.addEventListener('drop',e=>{
 const c=e.target.closest&&e.target.closest('.col');if(!c)return;e.preventDefault();
 const t=S.tasks.find(z=>z.id==e.dataTransfer.getData('text/plain'));if(t){t.date=c.dataset.date;save();render()}
});
document.addEventListener('dragend',()=>document.querySelectorAll('.dz').forEach(x=>x.classList.remove('dz')));
$('#f-h').innerHTML='<option value="">Сағат</option>'+[...Array(24).keys()].map(h=>`<option>${String(h).padStart(2,'0')}</option>`).join('');$('#f-m').innerHTML=[...Array(60).keys()].map(m=>`<option>${String(m).padStart(2,'0')}</option>`).join('');
const tick=()=>{if(user&&!['subs','timer','take','exam','notes','plans'].includes(view)&&!document.querySelector('dialog[open]'))render()};setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
document.querySelectorAll('.hero').forEach(i=>i.src=HERO);
sec();
if(SES)start();else showAuth();
</script>
</body>
